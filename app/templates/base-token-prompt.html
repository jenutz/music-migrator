<style>
  .container {
    width: 60%;
    height: 50%;
    /* define explicit height for flex scaling */
    min-height: 300px;
    /* fallback for small screens */
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);

    display: flex;
    flex-direction: column;
    /* stack children vertically */
  }

  label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
  }

  input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 15px;
    border-radius: 4px;
    border: 1px solid #aaa;
    font-size: 14px;
  }

  textarea {
    width: 100%;
    flex: 1;
    /* fills remaining space in container */
    min-height: 100px;
    /* prevents it from being too small */
    margin-bottom: 15px;
    border-radius: 4px;
    border: 1px solid #aaa;
    font-size: 14px;
    resize: vertical;
  }

  .description {
    font-size: 18px;
    color: #111;
    margin-bottom: 15px;
  }

  button {
    padding: 10px 20px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background: #0056b3;
  }

  #main-content {
    align-items: center;
  }
</style>



<div class="container">
  <h2>{% block title%}Вход{% endblock %}</h2>

  <div class="description">
    {% block description %}
    You can write anything you like here. This text serves as a helpful guide for what to enter.
    {% endblock %}
  </div>
  <textarea id="token-prompt" placeholder="{% block prompt %} Enter a description here {% endblock %}"></textarea>


  <button data-action="submitToken" data-url="/enter-token/{% block service %}None{% endblock %}" data-completes="token-{{self.service()}}"data-source="#token-prompt">
    Submit</button>
</div>
