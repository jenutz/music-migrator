<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicMigrator</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}?v={{ time }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='favicon.ico')}}?v={{ time }}">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  </head>
  
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      {% for sid in services %}
      <div class="service-row">
        <div class="service-header">
          <img src="{{ url_for('static', path=sid ~ '_icon.svg') }}" alt="Service {{ sid }} icon"
            style="height: 46px; width: auto;">
  
          <div class="service-name">{{ fullname[sid] }}</div>
  
        </div>
  
        <div class="buttons">
          <!-- Action button -->
          <button data-action="renderMainContent" data-url="token-prompt/{{ sid }}">Войти</button>
          <button data-action="execute" data-required="token-{{sid}}" data-url="fetch-tracks/{{ sid }}">Загрузить</button>
          <button data-action="renderMainContent" data-required="store-{{sid}}" data-url='/table/{{ sid }}'">Просмотр</button>
          <button data-action="renderMainContent" data-required="store-{{sid}}" data-url='/choose-import/{{ sid }}'">Экспорт</button>
        </div>
  
        <div class=" placeholder-text">Описание для {{ sid }}
        </div>
      </div>
      {% endfor %}
    </div>
  
    <div id="main-content"></div>
  
  
  </body>
  
  <script type="module">
    const completed = new Set({{ data_completed | tojson }});

    // helper to enable buttons based on requirements
    function reevaluateButtons() {
      document.querySelectorAll("button[data-required]").forEach(btn => {
        const reqs = btn.dataset.required.split(/\s+/);
        const enabled = reqs.every(r => completed.has(r));
        btn.disabled = !enabled;

        // optional: add/remove class for better styling
        btn.classList.toggle("locked", !enabled);
      });
    }
    reevaluateButtons()
    // helper to mark a requirement as completed
    function markCompleted(flag) {
      completed.add(flag);
      reevaluateButtons();
    }

    const actions = {
      renderMainContent: async (btn) => {
        const main = document.getElementById("main-content");
        if (!btn.dataset.url) {
          main.innerHTML = "";
          return;
        }
        const res = await fetch(btn.dataset.url);
        main.innerHTML = await res.text();

        // mark as completed if specified
        if (btn.dataset.completes) markCompleted(btn.dataset.completes);
      },

      execute: async (btn) => {
        const res = await fetch(btn.dataset.url, { method: "POST" });
        if (res.ok && btn.dataset.completes) markCompleted(btn.dataset.completes);
      },

      navigate: (btn) => {
        window.location.href = btn.dataset.url;
      },

      submitToken: async (btn) => {
        const selector = btn.dataset.source;
        const source = document.querySelector(selector);

        if (!source) {
          console.error("Target element not found:", selector);
          return;
        }

        const value = source.value;

        const res = await fetch(btn.dataset.url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ value })
        });

        if (res.ok && btn.dataset.completes) {
          markCompleted(btn.dataset.completes);
          const main = document.getElementById("main-content");
          main.innerHTML = "";
        }
      }
    };

    // universal click handler
    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;

      // check requirements first
      if (btn.dataset.required) {
        const reqs = btn.dataset.required.split(/\s+/);
        const satisfied = reqs.every(r => completed.has(r));
        if (!satisfied) return; // ignore clicks if requirements not met
      }

      const actionFn = actions[btn.dataset.action];
      if (!actionFn) {
        alert("Action handler not found: " + btn.dataset.action)
        return;
      }

      await actionFn(btn); // call the original action
    });
  </script>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#songsTable').DataTable({
                "pageLength": 1000,       // Show 25 rows per page by default
                "order": [[0, "dsc"]],   // default sort by ID ascending

                "columnDefs": [
                    { "className": "text-center", "targets": [0, 1, 2, 3] },  // force center
                    { "type": "num", "targets": [0, 3] }                        // numeric sorting
                ],

                "language": {
                    "search": "Поиск:",
                    "lengthMenu": "Показать _MENU_ записей",
                    "info": "Показано с _START_ по _END_ из _TOTAL_ записей",
                    "paginate": {
                        "first": "Первая",
                        "last": "Последняя",
                        "next": "Следующая",
                        "previous": "Предыдущая"
                    },
                    "zeroRecords": "Записи не найдены"
                }
            });
        });
    </script>
  
  </html>
