<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Selector with Icons</title>
<link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
            {% for sid in services %}
  <div class="service-row">
    <div class="service-header">
      <img src="{{ url_for('static', path=sid ~ '_icon.svg') }}" alt="Service {{ sid }} icon"
                style="height: 46px; width: auto;">

        <div class="service-name">{{ fullname[sid] }}</div>

    </div>

    <div class="buttons">
      <!-- Action button -->
      <button class="action-btn" data-action="load" data-id="{{ sid }}">Загрузить</button>

      <!-- Navigation button -->
      <button onclick="window.location.href='/table?service={{ sid }}'">Просмотр</button>
    </div>

    <div class="placeholder-text">Описание для {{ sid }}</div>
  </div>
{% endfor %}

</div>

<!-- Main content -->
<div class="main-content">
  <h2>Select Two Services and Order</h2>

  <!-- Order selection zone -->
  <div class="zone">
    <div class="selector">
      <!-- Service A icon -->
      <img src="{{ url_for('static', path='yt_icon.svg') }}" alt="yt"
                style="height: 100px; width: auto;">

      <!-- Arrow -->
      <div class="arrow-button" id="arrow">
        <span class="material-icons">arrow_forward</span>
      </div>

      <!-- Service B icon -->
      <img src="{{ url_for('static', path='yd_icon.svg') }}" alt="yt"
                style="height: 100px; width: auto;">
    </div>
  </div>

  <!-- Action buttons zone -->
  <div class="zone">
    <div class="action-buttons">
      <button>Сравнить</button>
      <button>Action 3</button>
      <button>Action 4</button>
      <button>Action 5</button>
    </div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
const arrow = document.getElementById('arrow');
const serviceA = document.getElementById('serviceA');
const serviceB = document.getElementById('serviceB');
let order = ['A', 'B'];

// Clicking arrow flips direction
arrow.addEventListener('click', () => {
  order.reverse();
  arrow.querySelector('span').textContent = order[0] === 'A' ? 'arrow_forward' : 'arrow_back';
});

// Update result
function submitSelection() {
  const fromService = order[0] === 'A' ? serviceA.textContent : serviceB.textContent;
  const toService = order[1] === 'A' ? serviceA.textContent : serviceB.textContent;

  document.getElementById('result').textContent = `Selected order: ${fromService} → ${toService}`;
}
</script>

</body>
</html>
